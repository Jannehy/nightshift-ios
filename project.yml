name: Nightshift
options:
  bundleIdPrefix: com.jannehy
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.9"
    # Keep this in step with the release tag: AltStore refuses to install
    # when the source and the IPA disagree about the version.
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "3"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Xcode's "recommended settings" prompt asks for these. Setting them here
    # instead of accepting the prompt, because the prompt writes into the
    # generated .xcodeproj, which the next `xcodegen generate` throws away.
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOL_EXTENSIONS: YES
    # Signing survives regeneration because the team lives here rather than in
    # the generated project. A Team ID is not a secret – it is embedded in every
    # signed app and readable from any IPA – but if you would rather keep it out
    # of the repository, comment this out and pass TEAM_ID to Tools/build-ipa.sh.
    DEVELOPMENT_TEAM: G8GVCRD6S2

targets:
  Nightshift:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jannehy.nightshift
        PRODUCT_NAME: Nightshift
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
